<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>生命價值王者爭霸戰</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background-color: #e0f7fa; margin: 0; padding: 0; }
        h1 { font-size: 22px; color: #00796b; text-align: center; margin: 15px 0; }
        #subtitle { font-size: 14px; color: #555; text-align: center; margin-top: -8px; font-family: '微軟正黑體', sans-serif; }
        #progress { background: #00796b; color: #fff; text-align: center; padding: 8px; }
        #optionsContainer { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; padding: 10px; }
        .option { width: 18%; max-width: 90px; padding: 6px; border: 2px solid #00796b; text-align: center; cursor: pointer; font-size: 14px; }
        .selected { background: #00796b; color: white; }
        #actionButtons { display: flex; justify-content: center; gap: 20px; margin: 15px 0; }
        button { padding: 12px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        #submitBtn { background: #00796b; color: white; }
        #resetBtn { background: #ff9800; color: white; }
        #result { text-align: center; margin-top: 10px; font-size: 16px; }
        #chartContainer { display: flex; justify-content: space-between; align-items: flex-end; height: 200px; margin-top: 10px; padding: 0 10%; }
        .bar { width: 30px; background: #4caf50; position: relative; }
        .bar span { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-weight: bold; font-size: 14px; }
        @media (max-width: 768px) {
            .option { width: 26%; font-size: 12px; }
            button { font-size: 14px; padding: 10px; }
            #chartContainer { height: 150px; padding: 0 5%; }
            .bar { width: 24px; }
        }
    </style>
</head>
<body>

<h1>生命價值王者爭霸戰</h1>
<div id="subtitle">聖母醫專生命教育團隊設計</div>
<div id="progress">已選0個，還剩10個</div>
<div id="optionsContainer"></div>
<div id="actionButtons">
    <button id="submitBtn" onclick="submitResult()">送出結果</button>
    <button id="resetBtn" onclick="resetTest()">重新測驗</button>
</div>
<div id="result"></div>
<div id="chartContainer"></div>

<script>
    const categories = {
        "靈性需求": ["宗教信仰", "快樂幸福", "自我反省與成長", "有希望不絕望", "有意義與價值"],
        "自我實現": ["工作表現傑出", "具有影響力", "持續創新與學習", "第二技能", "考證照實習順利"],
        "愛與歸屬需求": ["知心朋友", "社交活動", "家庭和睦", "戀愛", "不求回報的服務", "被理解接納"],
        "尊重需求": ["IG被按讚", "獲得獎項", "被稱讚", "擔任重要職位", "好名聲與成就"],
        "安全需求": ["住宿安全", "經濟穩定", "免於恐懼", "有存款", "國家治安好"],
        "生理需求": ["吃飽睡好", "身體健康", "足夠睡眠", "性慾滿足", "充足飲水"]
    };

    let allOptions = [];
    Object.entries(categories).forEach(([cat, opts]) => opts.forEach(opt => allOptions.push({ text: opt, category: cat })));

    const shuffled = [
        ...shuffle(allOptions.filter(o => o.category === '靈性需求')).slice(0, 6),
        ...shuffle(allOptions.filter(o => o.category !== '靈性需求'))
    ];

    let selected = [];
    function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }
    function renderOptions() {
        document.getElementById('optionsContainer').innerHTML = shuffled.map((o, i) => `
            <div class="option ${selected.includes(i) ? 'selected' : ''}" onclick="toggle(${i})">${o.text}</div>`).join('');
        updateProgress();
    }
    function toggle(i) { selected.includes(i) ? selected.splice(selected.indexOf(i), 1) : selected.length < 10 && selected.push(i); renderOptions(); }
    function updateProgress() { document.getElementById('progress').innerText = `已選${selected.length}個，還剩${10 - selected.length}個`; }
    function resetTest() { selected = []; renderOptions(); document.getElementById('result').innerHTML = ''; document.getElementById('chartContainer').innerHTML = ''; }

    function submitResult() {
        const result = { "靈性需求": 0, "自我實現": 0, "愛與歸屬需求": 0, "尊重需求": 0, "安全需求": 0, "生理需求": 0 };
        selected.forEach(i => result[shuffled[i].category]++);
        showChart(result);
        showEncouragement(result);
    }

    function showChart(result) {
        const colors = ["#FF6384", "#36A2EB", "#FFCE56", "#4CAF50", "#FF9800", "#9C27B0"];
        document.getElementById('chartContainer').innerHTML = Object.entries(result).map(([cat, v], i) => `
            <div><div class="bar" style="height:${v * 30}px;background:${colors[i]}"><span>${v}</span></div><div style="text-align:center;">${cat}</div></div>`).join('');
    }

    function showEncouragement(result) {
        const max = Math.max(...Object.values(result));
        const topCats = Object.keys(result).filter(k => result[k] === max);
        const encouragements = {
            "靈性需求": "你擁有強大的內心力量，記得每天問自己，我想成為怎樣的人。",
            "自我實現": "你的夢想是你最棒的燃料，Keep Going！",
            "愛與歸屬需求": "你是一個重感情的人，真誠的付出，會換來滿滿的愛。",
            "尊重需求": "你的閃光點早就存在，勇敢站出來發光吧！",
            "安全需求": "穩定與安全就是你最大後盾，穩紮穩打是王道。",
            "生理需求": "照顧好身體，才有力氣走更遠的路。"
        };
        document.getElementById('result').innerHTML = `你的需求傾向是：${topCats.join('、')}<br>${topCats.map(cat => "溫馨小建議：" + encouragements[cat]).join('<br>')}`;
    }
    renderOptions();
</script>

</body>
</html>
